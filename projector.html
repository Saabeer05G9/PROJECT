<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        Presentation Only
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            background: #050607;

            overflow: hidden;

        }

        body {

            display: flex;

            align-items: center;

            justify-content: center;

        }

        #projector {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #050607;

            overflow: hidden;

        }

        #slide {

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }

        #slide > * {

            max-width: 100% !important;
            max-height: 100% !important;

        }

        .waiting {

            color: #35e0a0;

            font-family:
                monospace;

            font-size: 18px;

            letter-spacing: .12em;

        }

    </style>

</head>


<body>

    <div id="projector">

        <div id="slide">

            <div class="waiting">
                WAITING FOR PRESENTATION
            </div>

        </div>

    </div>


    <script>

        /*
           Electron projector receiver.

           Slide data comes from the
           Electron main process through
           the preload bridge.
        */
/*
   Projector keyboard controls.

   These commands travel:

   Projector
      ↓
   Electron IPC
      ↓
   Laptop interface
      ↓
   goToSlide()
*/

window.addEventListener(
    "keydown",
    event => {

        let command =
            null;


        if (
            event.key ===
            "ArrowRight" ||
            event.key ===
            "PageDown"
        ) {

            command =
                "NEXT";

        }


        else if (
            event.key ===
            "ArrowLeft" ||
            event.key ===
            "PageUp"
        ) {

            command =
                "PREVIOUS";

        }


        else if (
            event.key ===
            "Home"
        ) {

            command =
                "FIRST";

        }


        else if (
            event.key ===
            "End"
        ) {

            command =
                "LAST";

        }


        if (
            command &&
            window.electronAPI &&
            typeof window.electronAPI.sendProjectorCommand ===
                "function"
        ) {

            event.preventDefault();


            window.electronAPI.sendProjectorCommand(
                {
                    command:
                        command
                }
            );

        }

    }
);

        if (
            window.electronAPI &&
            typeof window.electronAPI.onProjectorSlide ===
                "function"
        ) {

            window.electronAPI.onProjectorSlide(
                data => {

                    if (!data) {
                        return;
                    }


                    const slide =
                        document.getElementById(
                            "slide"
                        );


                    if (!slide) {
                        return;
                    }


                    slide.innerHTML =
                        data.html || "";

                }
            );

        }

    </script>

</body>

</html>
